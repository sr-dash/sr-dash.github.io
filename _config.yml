title: Soumyaranjan Dash
description: >-
  Solar physicist and Brinson Postdoctoral Research Associate at the National
  Solar Observatory, working on coronal magnetic field diagnostics, DKIST
  spectropolarimetry, and computational heliospheric modelling.
url: https://sr-dash.github.io
# jekyll-github-metadata (bundled with the github-pages gem) resolves this from
# PAGES_REPO_NWO on GitHub's own builder. CI has no such variable, so name it here.
repository: sr-dash/sr-dash.github.io
author:
  name: Soumyaranjan Dash
  email: sdash@nso.edu

theme: null

# All three are supported natively on GitHub Pages. jekyll-feed publishes
# /feed.xml so the writing can be subscribed to; jekyll-sitemap generates
# /sitemap.xml from the actual site content, replacing the hand-maintained
# file that had gone stale.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

# This structures clean URLs for your individual posts (e.g., /blog/post-title/)
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Source files that should not be copied into the built site.
exclude:
  # CI installs gems into vendor/bundle inside the repo; without this Jekyll
  # tries to build the gems' own post templates and the build fails.
  - vendor/
  - node_modules/
  - scripts/
  - README.md
  - LICENSE
  - NOTICE
  - Gemfile
  - Gemfile.lock
  - .github
  - .DS_Store
