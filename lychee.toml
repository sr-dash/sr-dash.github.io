# Link checker configuration.
#
# The goal is to catch genuinely dead links — like the Mauna Loa data portal
# that had started 404ing — without failing the build on the bot defences that
# academic publishers and social networks run. Every exclusion below is a site
# that works in a browser but refuses automated clients.

no_progress = true
max_concurrency = 4
max_redirects = 10
timeout = 40   # gong.nso.edu is slow to respond but healthy
retry_wait_time = 3
max_retries = 2

# A timeout is not evidence that a link is dead. It is what a slow or briefly
# offline host looks like, and from GitHub's runners it is what several
# institutional archives look like all the time. Accepting timeouts keeps those
# links under the check — a 404, a DNS failure or a TLS error still fails the
# build — without one host's outage turning CI red.
#
# The case that prompted this: from 5 October 2026 xrt.cfa.harvard.edu, home of
# the Hinode XRT flare catalogue, stopped answering on both ports while the
# rest of cfa.harvard.edu was up, and every CI run failed on that one link.
# Timeouts are still listed in the job summary, so a host that never comes
# back stays visible there rather than silently passing.
accept_timeouts = true

# 405: NASA ADS answers HEAD with "Method Not Allowed" though the page exists.
# 202: the ADS search endpoint answers asynchronously.
# 403/429: publisher rate limiting and bot filtering.
accept = [200, 202, 206, 403, 405, 429]

exclude = [
    # LinkedIn answers automated requests with its own 999 status.
    "linkedin\\.com",
    # Elsevier bounces link checkers through an OAuth flow that ends in a 400.
    "sciencedirect\\.com",
    # Valid site, but its TLS chain is not trusted by lychee's root store.
    "plutocode\\.ph\\.unito\\.it",
    # Deliberate placeholders in the Git tutorial, not real repositories.
    "github\\.com/user/",
    # gong.nso.edu, jsoc.stanford.edu and sidc.be used to be excluded here
    # because they time out from GitHub's runners. accept_timeouts above makes
    # that unnecessary, so they are checked again: their timeouts pass, and a
    # real 404 on any of them fails the build as it should.
]

exclude_path = ["_site/assets/vendor"]
