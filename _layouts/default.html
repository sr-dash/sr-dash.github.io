<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
{%- include head.html -%}
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <canvas id="ambient-grid-canvas" aria-hidden="true"></canvas>

    {%- include topbar.html -%}

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="layout-container">
        <main class="main-content" id="main-content">
            {{ content }}

            <a class="back-to-top-inline" href="#main-content">
                <i class="fa-solid fa-arrow-up" aria-hidden="true"></i> Back to top
            </a>
        </main>
    </div>

    {%- include footer.html -%}

    <div class="search-scrim" id="search-scrim" hidden>
        <div class="search-palette" role="dialog" aria-modal="true" aria-label="Search the site">
            <div class="search-field">
                <i class="fas fa-search" aria-hidden="true"></i>
                <label class="visually-hidden" for="page-search">Search the site</label>
                <input type="text" id="page-search" placeholder="Articles, publications, software, data sources&hellip;"
                       role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" autocomplete="off">
                <kbd aria-hidden="true">Esc</kbd>
            </div>
            <div class="search-results" id="search-results" role="listbox" aria-label="Search results"></div>
            <div class="search-foot">
                <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
                <span><kbd>&crarr;</kbd> open</span>
                <span><kbd>esc</kbd> close</span>
            </div>
        </div>
    </div>
    <p class="visually-hidden" id="search-status" role="status"></p>

    <script defer src="/assets/js/search.js"></script>
    <script defer src="/assets/js/script.js"></script>
    <script defer src="/assets/js/interactive-canvas.js"></script>
    {%- for script in page.extra_js %}
    <script defer src="/assets/js/{{ script }}.js"></script>
    {%- endfor %}

    <button id="scroll-to-top-btn" class="scroll-top-pill" aria-label="Scroll back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
</body>
</html>
