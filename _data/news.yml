# Dated updates for the home page. Rendered by _includes/news-list.html,
# newest first, so the order here does not matter — the `date` does.
#
#   date  "YYYY-MM", or "YYYY-MM-DD" when the day is worth stating. Keep the
#         quotes: unquoted, YAML reads a full date as a date and a month as
#         text, and the newest-first sort fails comparing the two.
#   kind  paper | talk | software | outreach | role. Sets the tag beside the date, and is
#         how a visitor tells a new paper from a new release at a glance.
#   body  One sentence. Inline HTML is allowed, so links go here.
#
# The seed entries below are all checkable against assets/data/soumya_publications.bib
# or the linked repositories. Add to the top of the file as things happen; the
# home page shows the most recent few and the rest stay here as a record.

- date: "2026-11-03"
  kind: software
  body: >
    <a href="https://sr-dash.github.io/heliofield/" target="_blank" rel="noopener">HelioField</a> 1.2.3
    adds a <a href="https://sr-dash.github.io/heliofield/spaceweather.html" target="_blank" rel="noopener">Space
    weather</a> page, with the coming fortnight's solar wind and magnetic sector
    at Earth from each day's model, and an
    <a href="https://sr-dash.github.io/heliofield/observations.html" target="_blank" rel="noopener">Observations</a>
    page that draws the model field over SDO, SOHO, STEREO and Solar Orbiter
    images from each spacecraft's viewpoint, back to 2010
    (<a href="https://doi.org/10.5281/zenodo.23487231" target="_blank" rel="noopener">Zenodo</a>; images
    archived as <a href="https://doi.org/10.5281/zenodo.23935774" target="_blank" rel="noopener">HelioField imagery</a>).

- date: "2026-11-01"
  kind: outreach
  body: >
    SolarNews, the AAS Solar Physics Division newsletter, featured
    <a href="https://solarnews.aas.org/2026/heliofleet-an-interactive-map-of-heliophysics-spacecraft-positions-and-fields-of-view-web/" target="_blank" rel="noopener">HelioFleet</a>
    and <a href="https://solarnews.aas.org/2026/introducing-heliofield-interactive-3d-exploration-of-the-solar-corona-and-heliosphere/" target="_blank" rel="noopener">HelioField</a>,
    after the UK Solar Physics newsletter carried
    <a href="https://uksolphys.org/education-and-public-outreach/heliofleet-an-interactive-map-of-heliophysics-spacecraft-positions-and-fields-of-view-web/" target="_blank" rel="noopener">HelioFleet</a>
    in October.

- date: "2026-10-30"
  kind: software
  body: >
    HelioField 1.1 and 1.2 add solar-wind source diagnostics at the spacecraft
    footpoints, the model's coronal holes, a
    <a href="https://sr-dash.github.io/heliofield/series.html" target="_blank" rel="noopener">solar-cycle
    series</a> since 2010, an adjustable source surface, the PFSS + Schatten
    current-sheet model, downloadable results with Python scripts, a
    <a href="https://sr-dash.github.io/heliofield/connect.html" target="_blank" rel="noopener">Connectivity</a>
    page for each in-situ spacecraft, and tests against exact solutions and
    sunkit-magex. HelioFleet 1.1.2 and HelioField now open each other at the
    same date.

- date: "2026-10-29"
  kind: software
  body: >
    <a href="https://sr-dash.github.io/heliofleet/" target="_blank" rel="noopener">HelioFleet</a> 1.1.1
    draws DKIST, IRIS, Hinode/EIS and Solar Orbiter observation footprints on
    SDO images since 2010, and finds the times when chosen facilities observed
    the same place on the Sun together
    (<a href="https://doi.org/10.5281/zenodo.23328187" target="_blank" rel="noopener">Zenodo</a>).

- date: "2026-10-20"
  kind: software
  body: >
    Released
    <a href="https://sr-dash.github.io/heliofield/" target="_blank" rel="noopener">HelioField</a>
    1.0: the Sun's coronal magnetic field in 3D for any date since 2010, with
    PFSS field lines from GONG and SDO/HMI magnetograms, the heliospheric
    current sheet, and the magnetic connection of Parker Solar Probe, Solar
    Orbiter and the rest of the fleet. Open source and archived on Zenodo
    (<a href="https://doi.org/10.5281/zenodo.23487231" target="_blank" rel="noopener">doi:10.5281/zenodo.23487231</a>).

- date: "2026-10-12"
  kind: software
  body: >
    Released
    <a href="https://sr-dash.github.io/heliofleet/" target="_blank" rel="noopener">HelioFleet</a>
    1.0, an interactive map of where SDO, Aditya-L1, Solar Orbiter, Parker
    Solar Probe and STEREO sit around the Sun and Earth on any date since 2010,
    built from JPL Horizons ephemerides. Version 1.1 followed the next day.
    Open source and archived on Zenodo
    (<a href="https://doi.org/10.5281/zenodo.23328187" target="_blank" rel="noopener">doi:10.5281/zenodo.23328187</a>).

- date: "2026-09"
  kind: talk
  body: >
    Two abstracts at the <b>57th meeting of the AAS Solar Physics Division</b>:
    <a href="/publications/#pub-2026SPD5730104D">Diagnosing Coronal Magnetic Field
    Structure and Thermodynamics with DKIST/Cryo-NIRSP and Forward Modeling</a>, and
    <a href="/publications/#pub-2026SPD5710785D">An Analysis of the Dependence on
    Inputs on Solar Polar Field Evolution</a> with Marc DeRosa, Lisa Upton,
    Sushant Mahajan and Todd Hoeksema.

- date: "2026-08"
  kind: software
  body: >
    Expanded the
    <a href="https://sr-dash.github.io/cryonirsp-viewer/" target="_blank" rel="noopener">CryoNIRSP
    Viewer</a> dashboard for browsing public DKIST Cryo-NIRSP datasets.

- date: "2026-08"
  kind: software
  body: >
    Continued development of
    <a href="https://sr-dash.github.io/SFT2D/" target="_blank" rel="noopener">SFT2D</a>,
    a surface flux transport framework for solar and stellar surface magnetic
    field evolution.

- date: "2026-05"
  kind: software
  body: >
    Released the
    <a href="https://sr-dash.github.io/cryonirsp-viewer/" target="_blank" rel="noopener">CryoNIRSP
    Viewer</a> for real-time interaction with multidimensional DKIST spectral
    data profiles.

- date: "2025-12"
  kind: talk
  body: >
    <a href="/publications/#pub-2025AGUFMSH11E8891P">The Sun's Corona has a Memory
    which allows for Predictions of Heliospheric Activity</a> presented at
    <b>AGU Fall Meeting 2025</b>, with Shaonwita Pal, Soumitra Hazra and
    Dibyendu Nandy.

- date: "2025-06"
  kind: talk
  body: >
    Two abstracts at the <b>246th AAS meeting</b>, on
    <a href="/publications/#pub-2025AAS24611304S">coronal magnetic fields and
    Alfv&eacute;nic waves measured by DKIST/Cryo-NIRSP</a> and on
    <a href="/publications/#pub-2025AAS24611001D">surface flux transport modelling
    of the polar field buildup</a>.

- date: "2024-11"
  kind: paper
  body: >
    <a href="/publications/#pub-2024ApJ975288D">Ensemble Kalman Filter Data
    Assimilation into the Surface Flux Transport Model to Infer Surface
    Flows</a> published in <i>The Astrophysical Journal</i>.
