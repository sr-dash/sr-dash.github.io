name: CI

# Every finding in the original site audit — a 404 on an external link, a page
# whose stylesheet path was wrong, LaTeX leaking into a title — was something a
# check could have caught. This runs on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so link rot on external sites surfaces without waiting for a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site --trace
        env:
          JEKYLL_ENV: production

      - name: Validate HTML and internal links
        uses: chabad360/htmlproofer@master
        with:
          directory: ./_site
          arguments: >-
            --check-html
            --disable-external
            --allow-hash-href
            --ignore-empty-alt
            --no-enforce-https

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 5

  links:
    name: External links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # Publishers routinely 403 automated clients; those are not breakage.
          args: >-
            --no-progress
            --accept 200,206,403,429
            --max-concurrency 4
            --exclude-path _site/assets/vendor
            --exclude 'github\.com/user/'
            '_site/**/*.html'
          fail: true
