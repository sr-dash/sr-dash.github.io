name: Sync publications from ADS

# Refreshes assets/data/soumya_publications.bib and _data/publications.yml from
# NASA ADS, then opens a pull request if anything changed — a new paper, or
# citation counts that have moved.
#
# One-time setup: add a repository secret named ADS_TOKEN with a token from
# https://ui.adsabs.harvard.edu/user/settings/token
# Without it the job exits early with a note rather than failing the repo.

on:
  schedule:
    # 07:00 UTC on the 1st of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without opening a PR'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Refresh bibliography
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for an ADS token
        id: token
        run: |
          if [ -z "${{ secrets.ADS_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ADS sync skipped"
              echo
              echo "No \`ADS_TOKEN\` secret is set, so there was nothing to sync."
              echo
              echo "To enable it: create a token at"
              echo "<https://ui.adsabs.harvard.edu/user/settings/token>, then add it under"
              echo "**Settings → Secrets and variables → Actions** as \`ADS_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync from ADS
        id: sync
        if: steps.token.outputs.present == 'true'
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="--dry-run"
          python3 scripts/sync_ads.py $ARGS | tee /tmp/sync.log
          {
            echo 'log<<SYNC_LOG_EOF'
            cat /tmp/sync.log
            echo 'SYNC_LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Summarise the change
        if: steps.token.outputs.present == 'true'
        run: |
          {
            echo "### ADS sync"
            echo
            echo '```'
            cat /tmp/sync.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the refreshed bibliography to a branch
        if: steps.token.outputs.present == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet; then
            echo "No changes to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/ads-sync
          git add assets/data/soumya_publications.bib _data/publications.yml _data/publications_meta.yml
          git commit -m "Refresh publication citation counts from ADS

          Regenerated by .github/workflows/sync-publications.yml. The sync
          merges: it updates counts and appends new papers, and never removes
          an entry."
          git push --force-with-lease origin chore/ads-sync

          {
            echo
            echo "Pushed to \`chore/ads-sync\`."
            echo
            echo "Open a PR: <https://github.com/${{ github.repository }}/compare/main...chore/ads-sync>"
            echo
            echo "Review the diff before merging. If ADS returned something that"
            echo "should not be published, add its bibcode to"
            echo "\`scripts/ads_exclude.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

# The job pushes a branch rather than opening a pull request, which would need
# "Allow GitHub Actions to create and approve pull requests" enabled on the
# repository. That toggle also lets Actions approve PRs, which this does not
# need. GitHub shows a one-click "Compare & pull request" banner on the branch.
