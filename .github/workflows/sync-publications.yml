name: Sync publications from ADS

# Refreshes assets/data/soumya_publications.bib and _data/publications.yml from
# NASA ADS, then opens a pull request if anything changed — a new paper, or
# citation counts that have moved.
#
# One-time setup: add a repository secret named ADS_TOKEN with a token from
# https://ui.adsabs.harvard.edu/user/settings/token
# Without it the job exits early with a note rather than failing the repo.

on:
  schedule:
    # 07:00 UTC on the 1st of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without opening a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh bibliography
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for an ADS token
        id: token
        run: |
          if [ -z "${{ secrets.ADS_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ADS sync skipped"
              echo
              echo "No \`ADS_TOKEN\` secret is set, so there was nothing to sync."
              echo
              echo "To enable it: create a token at"
              echo "<https://ui.adsabs.harvard.edu/user/settings/token>, then add it under"
              echo "**Settings → Secrets and variables → Actions** as \`ADS_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync from ADS
        id: sync
        if: steps.token.outputs.present == 'true'
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="--dry-run"
          python3 scripts/sync_ads.py $ARGS | tee /tmp/sync.log
          {
            echo 'log<<SYNC_LOG_EOF'
            cat /tmp/sync.log
            echo 'SYNC_LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Summarise the change
        if: steps.token.outputs.present == 'true'
        run: |
          {
            echo "### ADS sync"
            echo
            echo '```'
            cat /tmp/sync.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.token.outputs.present == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/ads-sync
          # Reuse one branch, so a month with no merge does not accumulate PRs.
          delete-branch: true
          title: 'Refresh publications from ADS'
          commit-message: |
            Refresh publications from ADS

            Regenerated by .github/workflows/sync-publications.yml from the ADS
            record for ORCID 0000-0003-0103-6569.
          body: |
            Automated refresh of the bibliography from NASA ADS.

            Check the diff for entries you would rather not publish — an
            erratum, a duplicate, or a same-name mismatch. To drop one
            permanently, add its bibcode to `scripts/ads_exclude.txt` and it
            will stay out of future syncs.

            <details><summary>Sync log</summary>

            ```
            ${{ steps.sync.outputs.log }}
            ```
            </details>
          add-paths: |
            assets/data/soumya_publications.bib
            _data/publications.yml
            _data/publications_meta.yml
